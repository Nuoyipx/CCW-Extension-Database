
name: Extract CCW Extension Database

on:
  workflow_dispatch:

  push:
    paths:
      - "sources.txt"
      - "extract.js"
      - "test.js"
      - ".github/workflows/extract.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout database repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript parser
        run: npm install --no-save @babel/parser@^7

      - name: Run extractor tests
        if: hashFiles('test.js') != ''
        run: node test.js

      - name: Run extractor
        run: node extract.js

      - name: Save generated database and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            blocks_database.json \
            extraction_report.json \
            version_report.json \
            extraction_diff.json \
            unresolved_blocks.json \
            quality_report.json \
            usable_blocks.json \
            translation_diagnostics.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update extension database"
            git push
          fi
